# Location for the existing kainode.duckdns.org server block (trade-news config).
# Install: copy to /etc/nginx/snippets/economy-model.conf and add inside the
# `listen 443` server block, before `location /`:
#     include /etc/nginx/snippets/economy-model.conf;
#
# Basic auth is inherited from the server block (/etc/nginx/trade-news.htpasswd).

location = /economy {
    return 301 /economy/;
}

location /economy/ {
    proxy_pass http://127.0.0.1:10010;   # no trailing slash: keep the /economy/ prefix
    proxy_http_version 1.1;
    # Streamlit talks to the browser over a websocket (/economy/_stcore/stream)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep an idle dashboard tab connected
    proxy_read_timeout 86400;
    proxy_buffering off;
}
